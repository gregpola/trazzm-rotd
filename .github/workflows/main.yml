# This is a basic workflow to help you get started with Actions

name: Create release

# Controls when the workflow will run
on: 
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      #Substitute the Manifest and Download URLs in the module.json
      - name: Substitute Manifest Version
        id: sub_manifest_version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: module.json
          field: version
          value: ${{github.event.release.tag_name}}

      - name: Substitute Manifest URL
        id: sub_manifest_url
        uses: jossef/action-set-json-field@v2.2
        with:
          file: module.json
          field: url
          value: https://github.com/${{github.repository}}

      - name: Substitute Manifest Link
        id: sub_manifest_link
        uses: jossef/action-set-json-field@v2.2
        with:
          file: module.json
          field: manifest
          value: https://github.com/${{github.repository}}/releases/latest/download/module.json

      - name: Substitute Manifest Download Link
        id: sub_manifest_download_link
        uses: jossef/action-set-json-field@v2.2
        with:
          file: module.json
          field: download
          value: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

      # create a zip file with all files required by the module to add to the release
      - run: zip -r ./module.zip . -x@.github/zip-exclude.lst

      # Update the 'latest' release
      - name: Create Release
        id: create_latest_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{github.event.release.name}}
          draft: false
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json,./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
